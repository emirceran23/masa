nt-size="13" lengthAdjust="spacing" textLength="220.6318" x="740.82" y="166.2935">&#214;deme Ko&#351;ullar&#305;, Genel H&#252;k&#252;mler</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="110.938" x="740.82" y="181.4263">Alternatif Ak&#305;&#351;:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.2573" x="740.82" y="196.5591">- D&#252;&#351;&#252;k g&#252;ven skorlu maddeler "Belirsiz" olarak</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.5991" x="749.0846" y="211.6919">i&#351;aretlenir ve kullan&#305;c&#305;ya sunulur</text></g><!--link UC03 to UC03a--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="16" id="lnk10"><path d="M609.68,307.1269 C671.02,304.6769 747.4348,301.6263 808.7748,299.1763" fill="none" id="UC03-to-UC03a" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="814.77,298.9369,805.6175,295.2992,809.774,299.1364,805.9368,303.2929,814.77,298.9369" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="63.0068" x="640.82" y="299.5938">&#171;include&#187;</text></g><!--link UC03 to UC03b--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" data-link-type="dependency" data-source-line="17" id="lnk11"><path d="M600.92,324.7769 C666.85,337.0769 755.5517,353.607 820.6017,365.737" fill="none" id="UC03-to-UC03b" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="826.5,366.8369,818.3858,361.2548,821.5847,365.9203,816.9193,369.1193,826.5,366.8369" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="63.0068" x="640.82" y="329.5938">&#171;include&#187;</text></g><!--