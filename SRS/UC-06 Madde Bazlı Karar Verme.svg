ll="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="122.5098" x="740.77" y="536.545">Durum Ge&#231;i&#351;leri:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.79" x="740.77" y="551.6778">Taslak &#8594; &#304;ncelemede &#8594; Onay Bekliyor &#8594;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147.3291" x="740.77" y="566.8106">Onayland&#305; / Reddedildi</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="85.1284" x="740.77" y="581.9435">Temel Ak&#305;&#351;:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.7529" x="740.77" y="597.0763">1. Kullan&#305;c&#305; maddeyi inceler</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.1616" x="740.77" y="612.2091">2. Onayla, Reddet veya Yeniden Revize Et se&#231;er</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.9541" x="740.77" y="627.3419">3. &#304;ste&#287;e ba&#287;l&#305; yorum ekler</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.3604" x="740.77" y="642.4747">4. Karar denetim izi olarak kaydedilir</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="57.7764" x="740.77" y="657.6075">K&#305;s&#305;tlar:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="347.5596" x="740.77" y="672.7403">- Y&#252;ksek risk maddelerinde otomatik onay YAPILMAZ,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.8462" x="749.0346" y="687.8731">insan onay&#305; zorunludur</text></g><!--link UC06 to UC06a--><g class="li