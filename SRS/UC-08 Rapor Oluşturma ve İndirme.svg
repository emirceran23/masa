ength="167.083" x="622.08" y="444.0735">- Karar durumlar&#305;n&#305;n &#246;zeti</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="155.6509" x="622.08" y="459.2063">Detayl&#305; Rapor &#304;&#231;eri&#287;i:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.5972" x="622.08" y="474.3391">- Madde bazl&#305; kategori, risk seviyesi</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.5972" x="622.08" y="489.4719">- Risk gerek&#231;esi, verilen karar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.9492" x="622.08" y="504.6047">- Kullan&#305;c&#305; yorumlar&#305;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="180.9653" x="622.08" y="519.7375">D&#305;&#351;a Aktar&#305;m Formatlar&#305;:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="71.8174" x="807.1777" y="519.7375">PDF, DOCX</text></g><!--link UC08 to UC08a--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="14" id="lnk8"><path d="M490.87,253.7369 C550.36,256.5869 630.2469,260.3999 692.4769,263.3799" fill="none" id="UC08-to-UC08a" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="698.47,263.6669,689.6716,259.241,693.4757,263.4277,689.289,267.2318,698.47,263.6669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="63.0068" x="522.08" y="252.5138">&#171;include&#187;</text></g><!--link UC08 to UC08c--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" data-link-type="dependency" data-source-line="15" id="lnk9"><path d="M486.14,238.5469 C497.76,236.4569 509.77,234.