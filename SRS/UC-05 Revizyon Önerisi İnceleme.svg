&#351;:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.2754" x="643.35" y="136.0278">1. Sistem y&#252;ksek/kritik riskli maddeleri belirler</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="347.7246" x="643.35" y="151.1606">2. Negotiation Agent, Playbook ve referans havuzunu</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.501" x="655.747" y="166.2935">ba&#287;lam olarak kullan&#305;r</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="337.8857" x="643.35" y="181.4263">3. Her riskli madde i&#231;in alternatif ifade &#246;nerisi &#252;retir</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.0298" x="643.35" y="196.5591">4. Kullan&#305;c&#305; &#246;nerileri inceler</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="110.938" x="643.35" y="211.6919">Alternatif Ak&#305;&#351;:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.9424" x="643.35" y="226.8247">- Kullan&#305;c&#305; &#246;nerilen metni aray&#252;z &#252;zerinden d&#252;zenler</text></g><!--link UC05 to UC05a--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" data-link-type="dependency" data-source-line="16" id="lnk10"><path d="M512.43,332.0869 C573.18,332.0869 657.48,332.0869 725.73,332.0869" fill="none" id="UC05-to-UC05a" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="731.73,332.0869,722.73,328.0869,726.73,332.0869,722.73,336.0869,731.73,332.0869" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="63.0068" x="543.35" y="328.1538">&#171;include&#187;</text></g><!--link UC05a 