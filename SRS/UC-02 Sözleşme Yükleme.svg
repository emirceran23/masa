000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.1484" x="590.597" y="543.9235">(maks. 10 MB)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.77" x="578.2" y="559.0563">3. Dosya nesne depolamaya kaydedilir</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.4175" x="578.2" y="574.1891">4. Dok&#252;man d&#252;z metne d&#246;n&#252;&#351;t&#252;r&#252;l&#252;r</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="110.938" x="578.2" y="589.3219">Alternatif Ak&#305;&#351;:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.0752" x="578.2" y="604.4547">- Taranm&#305;&#351; belgeler i&#231;in OCR uygulan&#305;r</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336.5464" x="578.2" y="619.5875">- D&#246;n&#252;&#351;t&#252;rme ba&#351;ar&#305;s&#305;z olursa hata mesaj&#305; g&#246;sterilir</text></g><!--link UC02 to UC02a--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="17" id="lnk11"><path d="M350.72,299.3769 C369.65,299.7569 389.61,300.0969 408.2,300.2969 C467.76,300.9169 482.74,303.6369 542.2,300.2969 C584.77,297.9069 625.7646,293.6772 665.4746,288.8072" fill="none" id="UC02-to-UC02a" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="671.43,288.0769,662.01,285.2022,666.4672,288.6855,662.9838,293.1427,671.43,288.0769" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="63.0068" x="443.7" y="296.3638">&#171;include&#187;</text></g><!--link UC02 to UC02b--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" data-link-type="dependency" data-source-line="18" id