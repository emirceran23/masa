 &#252;retilmi&#351; olmal&#305;d&#305;r (UC-05).</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="77.7271" x="687.32" y="373.9766">Son Ko&#351;ul:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.9673" x="769.1794" y="373.9766">Orijinal ve revize metinler kar&#351;&#305;la&#351;t&#305;rmal&#305;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.8066" x="687.32" y="389.1094">olarak g&#246;r&#252;nt&#252;lenir.</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="85.1284" x="687.32" y="404.2422">Temel Ak&#305;&#351;:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.4233" x="687.32" y="419.375">1. Orijinal madde metni sol panelde g&#246;sterilir</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="318.3477" x="687.32" y="434.5078">2. &#214;nerilen revizyon metni sa&#287; panelde g&#246;sterilir</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310.3496" x="687.32" y="449.6406">3. Eklenen k&#305;s&#305;mlar ye&#351;il, silinen k&#305;s&#305;mlar k&#305;rm&#305;z&#305;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.1392" x="699.717" y="464.7735">renk ile vurgulan&#305;r</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="110.938" x="687.32" y="479.9063">Alternatif Ak&#305;&#351;:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.9351" x="687.32" y="495.0391">- Sat&#305;r i&#231;i kar&#351;&#305;la&#351;t&#305;rma modu se&#231;ilebilir</text></g><!--link UC07 to UC07a--><g class="link" data