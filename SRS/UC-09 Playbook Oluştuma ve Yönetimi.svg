.3869 A0,0 0 0 0 732.36,456.3869" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1131.6017,456.3869 L1131.6017,466.3869 L1141.6017,466.3869 L1131.6017,456.3869" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="70.4844" x="738.36" y="473.4538">&#214;n Ko&#351;ul:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.2744" x="812.9767" y="473.4538">Kullan&#305;c&#305; giri&#351; yapm&#305;&#351; olmal&#305;d&#305;r.</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="77.7271" x="738.36" y="488.5866">Son Ko&#351;ul:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.5464" x="820.2194" y="488.5866">Playbook olu&#351;turulur/d&#252;zenlenir/silinir</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.0962" x="738.36" y="503.7194">ve vekt&#246;rel indeksler g&#252;ncellenir.</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="95.4624" x="738.36" y="518.8522">Kural Tipleri:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.9453" x="738.36" y="533.985">- Kabul edilebilir ifadeler</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.9951" x="738.36" y="549.1178">- Reddedilecek ifadeler</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.5566" x="738.36" y="564.2506">- Zorunlu olmas&#305; gereken h&#252;k&#252;mler</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.6729" x="738.36" y="579.3835">- Say&#305;sal e&#351;ik de&#287;erler</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="85.1284" x="738.36" y="594.5163">Temel Ak&#305;&#351;:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="345.6934" x="738.36" y="609.6491">1. Kullan&#305;c&#305; yeni Playbook olu&#351;turur (veya &#351;ablondan)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.3906" x="738.36" y="624.7819">2. Kurallar&#305; tan&#305;mlar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.834" x="738.36" y="639.9147">3. Birden fazla Playbook tan&#305;mlanabilir</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388.2417" x="738.36" y="655.0475">4. G&#252;ncelleme sonras&#305; vekt&#246;rel indeksler otomatik yenilenir</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="380.1611" x="738.36" y="670.1803">5. S&#246;zle&#351;me analizinde hangi Playbook kullan&#305;laca&#287;&#305; se&#231;ilir</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="54.647" x="738.36" y="685.3131">&#214;zellik:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.3511" x="738.36" y="700.446">- Sistem varsay&#305;lan bir Playbook &#351;ablonu sunar</text></g><!--link UC09 to UC09a--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="18" id="lnk12"><path d="M536.55,314.7769 C589.22,300.7369 665.35,280.9469 732.36,265.4469 C777.2,255.0769 821.9957,245.7896 861.5857,237.8996" fill="none" id="UC09-to-UC09a" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="867.47,236.7269,857.8618,234.5631,862.5664,237.7041,859.425